<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobboard | ค้นหางานประจำ</title>

<style>
:root {
  --navy: #193b65;
  --blue: #2864ad;
  --pale: #edf4ff;
  --bg: #f5f7fb;
  --line: #e1e7f0;
  --muted: #667085;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, Tahoma, sans-serif;
  background: var(--bg);
  color: #263449;
  line-height: 1.6;
}
header {
  background: var(--navy);
  color: white;
  padding: 24px 5%;
}
.header-inner, main, footer {
  max-width: 1180px;
  margin: auto;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-mark {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  border-radius: 12px;
  background: white;
  color: var(--navy);
  font-size: 24px;
  font-weight: bold;
}
header h1 { margin: 0; font-size: 27px; }
header p { margin: 4px 0 0; color: #dbe7f7; }
main { padding: 28px 18px 45px; }
h2 { margin-top: 0; }
.panel, .job-card {
  background: white;
  border: 1px solid var(--line);
  border-radius: 14px;
}
.panel { padding: 20px; margin-bottom: 22px; }
.filters {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}
.field { display: flex; flex-direction: column; gap: 6px; }
.field label {
  font-size: 13px;
  font-weight: bold;
  color: #475467;
}
input, select {
  width: 100%;
  min-width: 0;
  padding: 11px;
  border: 1px solid #ccd5e2;
  border-radius: 8px;
  background: white;
  color: #263449;
  font: inherit;
}
button, .apply-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: 8px;
  padding: 10px 14px;
  font: inherit;
  font-size: 14px;
  font-weight: bold;
  text-decoration: none;
  cursor: pointer;
}
button:hover, .apply-link:hover { opacity: .86; }
.primary { background: var(--blue); color: white; }
.secondary { background: #edf1f7; color: #344054; }
.quick { background: var(--pale); color: #214f86; }
.quick-search {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 9px;
  margin-top: 17px;
}
.result-line {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  margin: 22px 0 14px;
}
.result-line h2 { margin: 0; font-size: 21px; }
.muted { color: var(--muted); font-size: 13px; }
.jobs {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-auto-rows: max-content;
  align-items: start;
  gap: 16px;
}
.job-card { padding: 19px; min-width: 0; }
.company-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 15px;
}
.logo {
  flex: 0 0 54px;
  width: 54px;
  height: 54px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 18px;
  font-weight: bold;
  color: white;
}
.company-name {
  font-size: 14px;
  color: #596579;
  overflow-wrap: anywhere;
}
.job-card h3 {
  margin: 0 0 7px;
  color: var(--navy);
  font-size: 19px;
}
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.tag {
  background: var(--pale);
  color: #28568c;
  padding: 4px 9px;
  border-radius: 20px;
  font-size: 12px;
}
.salary { font-weight: bold; color: #236343; margin: 12px 0; }
.dates {
  background: #f8fafc;
  padding: 11px;
  border-radius: 9px;
  font-size: 13px;
  margin: 12px 0;
}
.dates p { margin: 3px 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.details {
  border-top: 1px solid var(--line);
  margin-top: 16px;
  padding-top: 14px;
  font-size: 14px;
}
.details h4 { color: var(--navy); margin: 0 0 10px; font-size: 17px; }
.details p { margin: 8px 0; overflow-wrap: anywhere; }
.details[hidden] { display: none !important; }
.empty {
  background: white;
  border: 1px dashed #cbd5e1;
  border-radius: 12px;
  padding: 35px 16px;
  text-align: center;
  color: var(--muted);
  grid-column: 1 / -1;
}
.notice {
  background: #fff8e8;
  border: 1px solid #f2dfad;
  color: #75551a;
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 13px;
  margin-bottom: 20px;
}
footer { padding: 0 18px 28px; color: var(--muted); font-size: 12px; }

@media (max-width: 760px) {
  .filters { grid-template-columns: 1fr 1fr; }
  .jobs { grid-template-columns: 1fr; }
}
@media (max-width: 500px) {
  .filters { grid-template-columns: 1fr; }
  header h1 { font-size: 23px; }
  .result-line { align-items: flex-start; flex-direction: column; }
}
</style>
</head>

function dateText(value) {
  if (!value) return "ไม่ระบุ";
  const [year, month, day] = value.split("-").map(Number);
  return `${String(day).padStart(2, "0")}/${String(month).padStart(2, "0")}/${year}`;
}

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function minusMonths(dateString, months) {
  const d = new Date(dateString + "T12:00:00");
  const day = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() - months);
  const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, lastDay));
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function addText(parent, tag, text, className = "") {
  const el = document.createElement(tag);
  el.textContent = text;
  if (className) el.className = className;
  parent.appendChild(el);
  return el;
}

function addDetailList(parent, heading, items) {
  addText(parent, "h4", heading);
  const ul = document.createElement("ul");
  items.forEach(item => addText(ul, "li", item));
  parent.appendChild(ul);
}

  addText(details, "p", "พื้นที่ทำงาน: " + job.location);
  addText(details, "p", "ค่าตอบแทน: " + job.salary);

  addText(details, "p", "วันที่ประกาศ: " + dateText(job.announced));
  addText(details, "p", "วันเริ่มรับสมัคร: " + dateText(job.start));
  addText(details, "p", "วันสิ้นสุดรับสมัคร: " + dateText(job.end));

  addText(details, "p", "รายละเอียดงาน: " + job.description);
  addText(details, "p", "คุณสมบัติ: " + job.qualification);
  addDetailList(details, "หน้าที่รับผิดชอบ", job.duties);
  addText(details, "p", "คณะวิชาที่บริษัทต้องการ: " + job.faculties.join(", "));
  addText(details, "p", "รูปแบบการทำงาน: " + job.workStyle);
  addText(details, "p", "สวัสดิการ: " + job.benefits);
  addText(details, "p", "ลิงก์สมัครงาน: " + job.applyUrl);
  addText(details, "p", "หมายเหตุ: ข้อมูลสมมติสำหรับทดลองระบบเท่านั้น", "muted");

  return details;
}

function renderJobs() {
  const q = keyword.value.trim().toLocaleLowerCase("th");
  const from = dateFrom.value;
  const to = dateTo.value;

  const filtered = jobs.filter(job => {
    const matchesText = (job.title + " " + job.company)
      .toLocaleLowerCase("th").includes(q);
    const matchesCategory = !category.value || job.category === category.value;
    const matchesLocation = !locationFilter.value || job.location === locationFilter.value;
    const matchesFaculty = !faculty.value ||
      job.faculties.includes(faculty.value) ||
      job.faculties.includes("ทุกคณะ");
    const matchesFrom = !from || job.announced >= from;
    const matchesTo = !to || job.announced <= to;

    return matchesText && matchesCategory && matchesLocation &&
      matchesFaculty && matchesFrom && matchesTo;
  }).sort((a, b) => b.announced.localeCompare(a.announced));

  resultCount.textContent = `พบ ${filtered.length} จาก ${jobs.length} ตำแหน่ง`;
  jobsContainer.replaceChildren();

  if (!filtered.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "ไม่พบประกาศงานที่ตรงกับเงื่อนไข ลองเปลี่ยนตัวกรองหรือกดล้างตัวกรอง";
    jobsContainer.appendChild(empty);
    return;
  }

  filtered.forEach(job => {
    const card = document.createElement("article");
    card.className = "job-card";

    const companyRow = document.createElement("div");
    companyRow.className = "company-row";

    const logo = document.createElement("div");
    logo.className = "logo";
    logo.style.backgroundColor = job.color;
    logo.textContent = job.initials;
    logo.setAttribute("aria-label", "โลโก้สมมติของ " + job.company);

    const companyName = document.createElement("div");
    companyName.className = "company-name";
    companyName.textContent = job.company;
    companyRow.append(logo, companyName);

    addText(card, "h3", job.title);

    const tags = document.createElement("div");
    tags.className = "tags";
    [job.category, job.location, "งานประจำ"].forEach(value => {
      addText(tags, "span", value, "tag");
    });

    const salary = addText(card, "div", job.salary, "salary");

    const dates = document.createElement("div");
    dates.className = "dates";
    addText(dates, "p", "วันที่ประกาศ: " + dateText(job.announced));
    addText(dates, "p", "เริ่มรับสมัคร: " + dateText(job.start));
    addText(dates, "p", "สิ้นสุดรับสมัคร: " + dateText(job.end));

    const details = createDetails(job);

    const actions = document.createElement("div");
    actions.className = "actions";

    const detailButton = document.createElement("button");
    detailButton.className = "secondary";
    detailButton.textContent = "ดูรายละเอียด";
    detailButton.setAttribute("aria-expanded", "false");

    detailButton.addEventListener("click", () => {
      const opening = details.hidden;
      details.hidden = !opening;
      detailButton.textContent = opening ? "ปิดรายละเอียด" : "ดูรายละเอียด";
      detailButton.setAttribute("aria-expanded", String(opening));

      if (opening) {
        details.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }
    });

    const applyButton = document.createElement("a");
    applyButton.className = "apply-link primary";
    applyButton.href = job.applyUrl;
    applyButton.target = "_blank";
    applyButton.rel = "noopener noreferrer";
    applyButton.textContent = "สมัครงาน";
    applyButton.addEventListener("click", event => {
      event.preventDefault();
      alert("นี่คือลิงก์สมัครงานตัวอย่าง ไม่ใช่ระบบสมัครงานจริง");
    });

    actions.append(detailButton, applyButton);
    card.append(companyRow, tags, salary, dates, actions, details);
    jobsContainer.appendChild(card);
  });
}

document.querySelectorAll("[data-months]").forEach(button => {
  button.addEventListener("click", () => {
    const months = Number(button.dataset.months);
    const today = todayISO();
    dateFrom.value = minusMonths(today, months);
    dateTo.value = today;
    renderJobs();
  });
});

$("clearFilters").addEventListener("click", () => {
  keyword.value = "";
  category.value = "";
  locationFilter.value = "";
  faculty.value = "";
  dateFrom.value = "";
  dateTo.value = "";
  renderJobs();
});

[keyword, category, locationFilter, faculty, dateFrom, dateTo].forEach(element => {
  element.addEventListener("input", renderJobs);
  element.addEventListener("change", renderJobs);
});

renderJobs();
</script>
</body>
</html>
