<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jobboard | ค้นหางาน</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      color: #243047;
      background: #f5f7fb;
    }
    header {
      background: #183b66;
      color: white;
      padding: 24px 6%;
    }
    header h1 { margin: 0 0 8px; }
    header p { margin: 0; color: #dbeafe; }
    main { max-width: 1100px; margin: auto; padding: 28px 18px; }
    .search-panel, .job-card, .detail {
      background: white;
      border: 1px solid #e4e9f1;
      border-radius: 12px;
      padding: 18px;
    }
    .search-panel {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd5e2;
      border-radius: 8px;
      background: white;
      font-size: 15px;
    }
    .job-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
    }
    .job-card h3 { margin: 0 0 10px; color: #183b66; }
    .company { color: #596579; margin: 0 0 14px; }
    .tag {
      display: inline-block;
      background: #eaf2ff;
      color: #214d82;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      margin: 0 5px 8px 0;
    }
    .salary { font-weight: bold; margin: 8px 0 14px; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 15px;
      background: #245da8;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #183b66; }
    .secondary { background: #e8edf5; color: #243047; }
    .detail { margin-top: 22px; }
    .hidden { display: none; }
    .notice { color: #68758a; font-size: 13px; margin-top: 24px; }
    @media (max-width: 650px) {
      .search-panel { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Jobboard</h1>
    <p>พื้นที่ค้นหางานและโอกาสในการทำงาน</p>
  </header>

  <main>
    <h2>ค้นหาตำแหน่งงาน</h2>
    <div class="search-panel">
      <input id="keyword" placeholder="ค้นหาตำแหน่งงานหรือบริษัท">
      <select id="jobType">
        <option value="">ประเภทงานทั้งหมด</option>
        <option>งานประจำ</option>
        <option>งานพาร์ตไทม์</option>
        <option>ฝึกงาน</option>
      </select>
      <select id="location">
        <option value="">พื้นที่ทั้งหมด</option>
        <option>กรุงเทพมหานคร</option>
        <option>นนทบุรี</option>
        <option>ปทุมธานี</option>
      </select>
    </div>

    <p id="resultCount"></p>
    <div id="jobs" class="job-list"></div>
    <section id="detail" class="detail hidden"></section>

    <p class="notice">
      เว็บไซต์ทดลอง ใช้ข้อมูลสมมติเท่านั้น ยังไม่ใช่ประกาศรับสมัครงานจริง
    </p>
  </main>

  <script>
    // ข้อมูลสมมติสำหรับทดสอบเท่านั้น
    const jobs = [
      {
        id: 1,
        title: "เจ้าหน้าที่ประสานงาน",
        company: "บริษัท ตัวอย่าง เอ จำกัด",
        type: "งานประจำ",
        location: "กรุงเทพมหานคร",
        salary: "15,000–18,000 บาท/เดือน",
        description: "ประสานงานภายในองค์กร จัดเตรียมเอกสาร และติดต่อหน่วยงานที่เกี่ยวข้อง",
        qualification: "ใช้โปรแกรมสำนักงานพื้นฐานได้ และสื่อสารได้ดี"
      },
      {
        id: 2,
        title: "นักวาดภาพประกอบ",
        company: "สตูดิโอ ตัวอย่าง บี",
        type: "ฝึกงาน",
        location: "นนทบุรี",
        salary: "เบี้ยเลี้ยงตามเงื่อนไขสมมติ",
        description: "ช่วยจัดทำภาพประกอบและพัฒนาผลงานร่วมกับทีมสร้างสรรค์",
        qualification: "มีผลงานวาดภาพและพร้อมเรียนรู้"
      },
      {
        id: 3,
        title: "ผู้ช่วยดูแลลูกค้า",
        company: "บริษัท ตัวอย่าง ซี จำกัด",
        type: "งานพาร์ตไทม์",
        location: "ปทุมธานี",
        salary: "ตามชั่วโมงทำงาน (ข้อมูลสมมติ)",
        description: "ให้ข้อมูลเบื้องต้นแก่ลูกค้าและช่วยดูแลงานบริการ",
        qualification: "มีมนุษยสัมพันธ์ดีและตรงต่อเวลา"
      },
      {
        id: 4,
        title: "เจ้าหน้าที่การตลาด",
        company: "บริษัท ตัวอย่าง ดี จำกัด",
        type: "งานประจำ",
        location: "กรุงเทพมหานคร",
        salary: "18,000–22,000 บาท/เดือน",
        description: "ช่วยวางแผนกิจกรรมการตลาดและจัดทำเนื้อหาประชาสัมพันธ์",
        qualification: "มีทักษะการสื่อสารและทำงานเป็นทีม"
      },
      {
        id: 5,
        title: "ผู้ช่วยฝ่ายทรัพยากรบุคคล",
        company: "บริษัท ตัวอย่าง อี จำกัด",
        type: "ฝึกงาน",
        location: "นนทบุรี",
        salary: "ตามเงื่อนไขการฝึกงาน (ข้อมูลสมมติ)",
        description: "ช่วยงานเอกสารและประสานงานการรับสมัครงาน",
        qualification: "ละเอียดรอบคอบและใช้โปรแกรมสำนักงานได้"
      },
      {
        id: 6,
        title: "ผู้ช่วยร้านค้า",
        company: "ร้านตัวอย่าง เอฟ",
        type: "งานพาร์ตไทม์",
        location: "กรุงเทพมหานคร",
        salary: "ตามชั่วโมงทำงาน (ข้อมูลสมมติ)",
        description: "ช่วยจัดสินค้าและให้บริการลูกค้า",
        qualification: "ทำงานร่วมกับผู้อื่นได้และมีความรับผิดชอบ"
      }
    ];

    const keyword = document.getElementById("keyword");
    const jobType = document.getElementById("jobType");
    const locationFilter = document.getElementById("location");
    const jobContainer = document.getElementById("jobs");
    const resultCount = document.getElementById("resultCount");
    const detail = document.getElementById("detail");

    function renderJobs() {
      const q = keyword.value.trim().toLowerCase();
      const type = jobType.value;
      const location = locationFilter.value;

      const filtered = jobs.filter(job =>
        (job.title + " " + job.company).toLowerCase().includes(q) &&
        (!type || job.type === type) &&
        (!location || job.location === location)
      );

      resultCount.textContent = `พบ ${filtered.length} ตำแหน่งงาน`;
      jobContainer.innerHTML = "";

      if (filtered.length === 0) {
        jobContainer.textContent = "ไม่พบตำแหน่งงานที่ตรงกับเงื่อนไข";
        return;
      }

      filtered.forEach(job => {
        const card = document.createElement("article");
        card.className = "job-card";

        const title = document.createElement("h3");
        title.textContent = job.title;

        const company = document.createElement("p");
        company.className = "company";
        company.textContent = job.company;

        const tags = document.createElement("div");
        [job.type, job.location].forEach(value => {
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = value;
          tags.appendChild(tag);
        });

        const salary = document.createElement("p");
        salary.className = "salary";
        salary.textContent = job.salary;

        const button = document.createElement("button");
        button.textContent = "ดูรายละเอียด";
        button.addEventListener("click", () => showDetail(job.id));

        card.append(title, company, tags, salary, button);
        jobContainer.appendChild(card);
      });
    }

    function showDetail(id) {
      const job = jobs.find(item => item.id === id);
      if (!job) return;

      detail.replaceChildren();
      detail.classList.remove("hidden");

      const title = document.createElement("h2");
      title.textContent = job.title;

      const company = document.createElement("p");
      company.textContent = "บริษัท: " + job.company;

      const type = document.createElement("p");
      type.textContent = "ประเภทงาน: " + job.type;

      const location = document.createElement("p");
      location.textContent = "สถานที่: " + job.location;

      const salary = document.createElement("p");
      salary.textContent = "ค่าตอบแทน: " + job.salary;

      const description = document.createElement("p");
      description.textContent = "รายละเอียดงาน: " + job.description;

      const qualification = document.createElement("p");
      qualification.textContent = "คุณสมบัติ: " + job.qualification;

      const note = document.createElement("p");
      note.textContent = "นี่คือข้อมูลสมมติสำหรับทดสอบ ยังไม่ได้เปิดรับสมัครจริง";

      const close = document.createElement("button");
      close.className = "secondary";
      close.textContent = "ปิดรายละเอียด";
      close.addEventListener("click", () => detail.classList.add("hidden"));

      detail.append(title, company, type, location, salary,
        description, qualification, note, close);
      detail.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    [keyword, jobType, locationFilter].forEach(element => {
      element.addEventListener("input", renderJobs);
      element.addEventListener("change", renderJobs);
    });

    renderJobs();
  </script>
</body>
</html>
