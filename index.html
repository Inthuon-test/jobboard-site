<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jobboard | ค้นหางาน</title>

  <style>
    :root {
      --primary: #2457c5;
      --primary-dark: #19439b;
      --text: #202938;
      --muted: #667085;
      --border: #e2e7ef;
      --bg: #f5f7fb;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.6;
    }

    body.modal-open {
      overflow: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .site-header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 22px 20px;
    }

    .header-inner,
    .container {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
    }

    .brand {
      margin: 0;
      color: var(--primary);
      font-size: 28px;
      font-weight: 800;
    }

    .tagline {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    main {
      padding: 28px 0 48px;
    }

    .page-title {
      margin: 0 0 6px;
      font-size: 25px;
    }

    .page-description {
      color: var(--muted);
      margin: 0 0 22px;
      font-size: 14px;
    }

    .filter-panel {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .field {
      min-width: 0;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .field input,
    .field select {
      width: 100%;
      min-width: 0;
      padding: 11px 12px;
      border: 1px solid #cfd6e2;
      border-radius: 9px;
      background: var(--white);
      color: var(--text);
      outline: none;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px #2457c51a;
    }

    .quick-filter {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 18px;
    }

    .quick-label {
      font-size: 13px;
      font-weight: 700;
      margin-right: 4px;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 14px;
      background: var(--white);
      color: var(--text);
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn:hover {
      background: #f0f4fb;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      color: white;
    }

    .btn.active {
      background: #eaf0ff;
      color: var(--primary);
      border-color: var(--primary);
    }

    .btn-reset {
      margin-left: auto;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .results-header h2 {
      font-size: 19px;
      margin: 0;
    }

    .result-count {
      color: var(--muted);
      font-size: 13px;
    }

    /* การ์ด 2 คอลัมน์ และแยกความสูงของแต่ละการ์ด */
    .jobs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-auto-rows: max-content;
      align-items: start;
      gap: 16px;
    }

    .job-card {
      align-self: start;
      min-width: 0;
      padding: 18px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 2px 7px #15294b08;
    }

    .company-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 13px;
      min-width: 0;
    }

    .company-logo {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 0 0 54px;
      width: 54px;
      height: 54px;
      overflow: hidden;
      border-radius: 12px;
      background: #eaf0ff;
      color: var(--primary);
      font-weight: 800;
      font-size: 17px;
      text-align: center;
    }

    .company-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: white;
    }

    .company-info {
      min-width: 0;
    }

    .company-name {
      margin: 0;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .job-type {
      display: inline-block;
      color: #176a45;
      background: #e8f7ef;
      border-radius: 5px;
      padding: 2px 7px;
      margin-top: 3px;
      font-size: 11px;
      font-weight: 700;
    }

    .job-title {
      margin: 0 0 9px;
      font-size: 19px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .job-summary {
      display: grid;
      gap: 5px;
      margin-bottom: 14px;
      color: #475467;
      font-size: 13px;
    }

    .job-summary div {
      overflow-wrap: anywhere;
    }

    .job-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      border-top: 1px solid #edf0f5;
      padding-top: 14px;
    }

    .job-actions .btn {
      flex: 1 1 120px;
    }

    .empty-state {
      grid-column: 1 / -1;
      background: white;
      border: 1px dashed #cfd6e2;
      border-radius: 14px;
      text-align: center;
      padding: 36px 18px;
      color: var(--muted);
    }

    /* Popup / Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(15, 23, 42, 0.65);
      overscroll-behavior: contain;
    }

    .modal-backdrop[hidden] {
      display: none !important;
    }

    .modal {
      position: relative;
      display: flex;
      flex-direction: column;
      width: min(720px, 100%);
      max-height: 88vh;
      max-height: 88dvh;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 80px #00000040;
      animation: modal-in 0.18s ease-out;
    }

    @keyframes modal-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 20px 22px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .modal-heading {
      flex: 1;
      min-width: 0;
    }

    .modal-heading h2 {
      margin: 0;
      font-size: 21px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .modal-heading p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .modal-close {
      flex: 0 0 38px;
      width: 38px;
      height: 38px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 0;
      border-radius: 9px;
      background: #f0f2f6;
      color: #344054;
      font-size: 28px;
      line-height: 1;
    }

    .modal-close:hover {
      background: #e1e6ef;
    }

    .modal-body {
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 22px;
    }

    .detail-section {
      margin-bottom: 22px;
    }

    .detail-section:last-child {
      margin-bottom: 0;
    }

    .detail-section h3 {
      margin: 0 0 9px;
      font-size: 16px;
    }

    .detail-section p {
      margin: 5px 0;
      overflow-wrap: anywhere;
    }

    .detail-list {
      margin: 0;
      padding-left: 22px;
    }

    .detail-list li {
      margin-bottom: 6px;
      overflow-wrap: anywhere;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .detail-item {
      padding: 12px;
      border-radius: 10px;
      background: #f6f8fc;
      min-width: 0;
    }

    .detail-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 3px;
    }

    .detail-value {
      font-size: 14px;
      font-weight: 700;
      overflow-wrap: anywhere;
      white-space: pre-line;
    }

    .modal-footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      padding: 16px 22px;
      border-top: 1px solid var(--border);
      background: white;
      flex-shrink: 0;
    }

    .demo-note {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #fff7e6;
      color: #8a5700;
      font-size: 12px;
    }

    footer {
      padding: 20px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 640px) {
      .site-header {
        padding: 18px 0;
      }

      .brand {
        font-size: 24px;
      }

      main {
        padding-top: 20px;
      }

      .page-title {
        font-size: 22px;
      }

      .filter-panel {
        padding: 14px;
      }

      .filter-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .btn-reset {
        margin-left: 0;
      }

      .jobs {
        grid-template-columns: minmax(0, 1fr);
      }

      .job-card {
        padding: 15px;
      }

      .job-title {
        font-size: 18px;
      }

      .modal-backdrop {
        padding: 10px;
      }

      .modal {
        max-height: 92vh;
        max-height: 92dvh;
        border-radius: 13px;
      }

      .modal-header {
        padding: 15px;
        gap: 10px;
      }

      .modal-heading h2 {
        font-size: 18px;
      }

      .modal-body {
        padding: 16px;
      }

      .detail-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .modal-footer {
        padding: 12px 15px;
      }

      .modal-footer .btn {
        flex: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

  <header class="site-header">
    <div class="header-inner">
      <p class="brand">Jobboard</p>
      <p class="tagline">ค้นหาตำแหน่งงานที่เหมาะกับคุณ</p>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">ค้นหางาน</h1>
    <p class="page-description">
      ค้นหาตำแหน่งงานประจำ ดูรายละเอียด และตรวจสอบข้อมูลการสมัคร
    </p>

    <section class="filter-panel" aria-label="ตัวกรองตำแหน่งงาน">
      <div class="filter-grid">
        <div class="field">
          <label for="keyword">ค้นหาชื่อบริษัทหรือชื่อตำแหน่ง</label>
          <input
            id="keyword"
            type="search"
            placeholder="เช่น บริษัท ABC, เจ้าหน้าที่..."
            autocomplete="off"
          >
        </div>

        <div class="field">
          <label for="jobFamily">สายงาน</label>
          <select id="jobFamily">
            <option value="">ทุกสายงาน</option>
          </select>
        </div>

        <div class="field">
          <label for="location">พื้นที่ทำงาน</label>
          <select id="location">
            <option value="">ทุกพื้นที่</option>
          </select>
        </div>

        <div class="field">
          <label for="faculty">คณะที่บริษัทต้องการ</label>
          <select id="faculty">
            <option value="">ทุกคณะ</option>
          </select>
        </div>
      </div>

      <div class="quick-filter">
        <span class="quick-label">ประกาศย้อนหลัง:</span>
        <button class="btn quick-btn" type="button" data-months="1">1 เดือน</button>
        <button class="btn quick-btn" type="button" data-months="2">2 เดือน</button>
        <button class="btn quick-btn" type="button" data-months="3">3 เดือน</button>
        <button class="btn btn-reset" id="clearFilters" type="button">
          ล้างตัวกรอง
        </button>
      </div>
    </section>

    <section aria-label="ผลการค้นหางาน">
      <div class="results-header">
        <h2>ตำแหน่งงานที่เปิดรับ</h2>
        <span class="result-count" id="resultCount" aria-live="polite"></span>
      </div>

      <div class="jobs" id="jobsList"></div>
    </section>
  </main>

  <footer>
    Jobboard — เว็บไซต์ตัวอย่างสำหรับแสดงประกาศรับสมัครงาน
  </footer>

  <!-- Popup รายละเอียดงาน -->
  <div
    class="modal-backdrop"
    id="jobModal"
    hidden
    role="presentation"
  >
    <section
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
      aria-describedby="modalCompany"
    >
      <div class="modal-header">
        <div class="company-logo" id="modalLogo" aria-hidden="true">JB</div>
        <div class="modal-heading">
          <h2 id="modalTitle">รายละเอียดตำแหน่งงาน</h2>
          <p id="modalCompany"></p>
        </div>
        <button
          class="modal-close"
          id="closeModal"
          type="button"
          aria-label="ปิดรายละเอียด"
          title="ปิด"
        >×</button>
      </div>

      <div class="modal-body" id="modalBody"></div>

      <div class="modal-footer">
        <button class="btn" id="closeModalBottom" type="button">ปิด</button>
        <button class="btn btn-primary" id="modalApply" type="button">
          สมัครงาน
        </button>
      </div>
    </section>
  </div>

        duties: [
          "ประสานงานและนัดหมายกับผู้เกี่ยวข้อง",

      },
      {
        id: "JOB005",

        salary: "17,000–24,000 บาท",

        ],

          "มีความคิดสร้างสรรค์และทำงานเป็นทีมได้",
          "สามารถใช้โปรแกรมสำนักงานพื้นฐานได้"
        ],
        workDays: "จันทร์–ศุกร์",
        workTime: "09:00–18:00 น.",
        benefits: "ประกันสังคม โบนัสตามผลประกอบการ และวันหยุดประจำปี",
        applyUrl: "https://example.com/apply/JOB005"
      },
      {
        id: "JOB006",
        company: "บริษัท ออฟฟิศ โซลูชัน จำกัด",
        logoText: "OS",
        logoUrl: "",
        title: "เจ้าหน้าที่ทรัพยากรบุคคล",
        family: "ทรัพยากรบุคคล",
        location: "นนทบุรี",
        faculty: ["คณะบริหารธุรกิจ", "คณะศิลปศาสตร์"],
        salary: "16,000–23,000 บาท",
        quantity: "1 อัตรา",
        published: "2026-06-15",
        startDate: "2026-06-20",
        endDate: "2026-10-20",
        description: "สนับสนุนงานสรรหา จัดเก็บข้อมูลพนักงาน และงานเอกสารของฝ่ายทรัพยากรบุคคล",
        duties: [
          "นัดหมายผู้สมัครและประสานงานสัมภาษณ์",
          "จัดเก็บและตรวจสอบเอกสารพนักงาน",
          "สนับสนุนงานธุรการของฝ่ายทรัพยากรบุคคล"
        ],
        qualifications: [
          "จบการศึกษาระดับปริญญาตรี",
          "มีทักษะการสื่อสารและการจัดการเอกสาร",
          "รักษาความลับของข้อมูลได้"
        ],
        workDays: "จันทร์–ศุกร์",
        workTime: "08:30–17:30 น.",
        benefits: "ประกันสังคม วันหยุดประจำปี และสวัสดิการตามบริษัทกำหนด",
        applyUrl: "https://example.com/apply/JOB006"
      }
    ];

    const jobsList = document.getElementById("jobsList");
    const keywordInput = document.getElementById("keyword");
    const familySelect = document.getElementById("jobFamily");
    const locationSelect = document.getElementById("location");
    const facultySelect = document.getElementById("faculty");
    const resultCount = document.getElementById("resultCount");
    const clearFiltersButton = document.getElementById("clearFilters");
    const quickButtons = [...document.querySelectorAll(".quick-btn")];

    const modal = document.getElementById("jobModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalCompany = document.getElementById("modalCompany");
    const modalLogo = document.getElementById("modalLogo");
    const modalBody = document.getElementById("modalBody");
    const closeModalButton = document.getElementById("closeModal");
    const closeModalBottom = document.getElementById("closeModalBottom");
    const modalApply = document.getElementById("modalApply");

    let selectedMonths = null;
    let activeJob = null;
    let lastFocusedElement = null;

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function formatDate(value) {
      if (!value) return "ไม่ระบุ";

      const parts = value.split("-").map(Number);
      const date = new Date(parts[0], parts[1] - 1, parts[2]);

      return new Intl.DateTimeFormat("th-TH", {
        day: "numeric",
        month: "short",
        year: "numeric"
      }).format(date);
    }

    function populateSelect(select, values, defaultLabel) {
      const uniqueValues = [...new Set(values)].sort((a, b) =>
        a.localeCompare(b, "th")
      );

      select.innerHTML =
        `<option value="">${escapeHTML(defaultLabel)}</option>` +
        uniqueValues.map(value =>
          `<option value="${escapeHTML(value)}">${escapeHTML(value)}</option>`
        ).join("");
    }

    function setupFilters() {
      populateSelect(
        familySelect,
        jobs.map(job => job.family),
        "ทุกสายงาน"
      );

      populateSelect(
        locationSelect,
        jobs.map(job => job.location),
        "ทุกพื้นที่"
      );

      populateSelect(
        facultySelect,
        jobs.flatMap(job => job.faculty),
        "ทุกคณะ"
      );
    }

    function logoHTML(job) {
      if (job.logoUrl) {
        return `
          <div class="company-logo">
            <img
              src="${escapeHTML(job.logoUrl)}"
              alt="โลโก้ ${escapeHTML(job.company)}"
              onerror="this.parentElement.textContent='${escapeHTML(job.logoText)}'"
            >
          </div>
        `;
      }

      return `
        <div class="company-logo" aria-label="โลโก้ตัวอย่าง">
          ${escapeHTML(job.logoText || "JOB")}
        </div>
      `;
    }

    function getFilteredJobs() {
      const keyword = keywordInput.value.trim().toLocaleLowerCase("th");
      const family = familySelect.value;
      const location = locationSelect.value;
      const faculty = facultySelect.value;

      const today = new Date();
      today.setHours(23, 59, 59, 999);

      let cutoff = null;

      if (selectedMonths !== null) {
        cutoff = new Date();
        cutoff.setHours(0, 0, 0, 0);
        cutoff.setMonth(cutoff.getMonth() - selectedMonths);
      }

      return jobs.filter(job => {
        const searchable = `${job.company} ${job.title}`.toLocaleLowerCase("th");

        if (keyword && !searchable.includes(keyword)) return false;
        if (family && job.family !== family) return false;
        if (location && job.location !== location) return false;
        if (faculty && !job.faculty.includes(faculty)) return false;

        if (cutoff) {
          const publishedDate = new Date(job.published + "T00:00:00");
          if (publishedDate < cutoff || publishedDate > today) return false;
        }

        return true;
      });
    }

    function renderJobs() {
      const filteredJobs = getFilteredJobs();

      resultCount.textContent = `พบ ${filteredJobs.length} ตำแหน่ง`;

      if (filteredJobs.length === 0) {
        jobsList.innerHTML = `
          <div class="empty-state">
            <strong>ไม่พบตำแหน่งงานที่ตรงกับเงื่อนไข</strong>
            <div>ลองเปลี่ยนคำค้นหาหรือกด “ล้างตัวกรอง”</div>
          </div>
        `;
        return;
      }

      jobsList.innerHTML = filteredJobs.map(job => `
        <article class="job-card">
          <div class="company-row">
            ${logoHTML(job)}
            <div class="company-info">
              <p class="company-name">${escapeHTML(job.company)}</p>
              <span class="job-type">งานประจำ (Full-time)</span>
            </div>
          </div>

          <h3 class="job-title">${escapeHTML(job.title)}</h3>

          <div class="job-summary">
            <div>สายงาน: ${escapeHTML(job.family)}</div>
            <div>พื้นที่: ${escapeHTML(job.location)}</div>
            <div>เงินเดือน: ${escapeHTML(job.salary)}</div>
            <div>วันที่ประกาศ: ${formatDate(job.published)}</div>
          </div>

          <div class="job-actions">
            <button
              class="btn btn-primary"
              type="button"
              data-detail="${escapeHTML(job.id)}"
            >ดูรายละเอียด</button>
            <button
              class="btn"
              type="button"
              data-apply="${escapeHTML(job.id)}"
            >สมัครงาน</button>
          </div>
        </article>
      `).join("");
    }

    function detailItem(label, value) {
      return `
        <div class="detail-item">
          <div class="detail-label">${escapeHTML(label)}</div>
          <div class="detail-value">${escapeHTML(value || "ไม่ระบุ")}</div>
        </div>
      `;
    }

    function detailSection(title, content) {
      return `
        <section class="detail-section">
          <h3>${escapeHTML(title)}</h3>
          ${content}
        </section>
      `;
    }

    function listHTML(items) {
      if (!items || items.length === 0) {
        return "<p>ไม่ระบุ</p>";
      }

      return `
        <ul class="detail-list">
          ${items.map(item => `<li>${escapeHTML(item)}</li>`).join("")}
        </ul>
      `;
    }

    function openJobModal(job) {
      activeJob = job;
      lastFocusedElement = document.activeElement;

      modalTitle.textContent = job.title;
      modalCompany.textContent = job.company;

      modalLogo.innerHTML = "";
      if (job.logoUrl) {
        const image = document.createElement("img");
        image.src = job.logoUrl;
        image.alt = "โลโก้ " + job.company;
        image.onerror = () => {
          modalLogo.textContent = job.logoText || "JOB";
        };
        modalLogo.appendChild(image);
      } else {
        modalLogo.textContent = job.logoText || "JOB";
      }

      modalBody.innerHTML = `
        ${detailSection("ข้อมูลตำแหน่งงาน", `
          <div class="detail-grid">
            ${detailItem("ชื่อตำแหน่ง", job.title)}
            ${detailItem("ประเภทงาน", "งานประจำ (Full-time)")}
            ${detailItem("สายงาน", job.family)}
            ${detailItem("จำนวนที่รับ", job.quantity)}
            ${detailItem("พื้นที่ทำงาน", job.location)}
            ${detailItem("เงินเดือน", job.salary)}
          </div>
        `)}

        ${detailSection("วันที่สำคัญ", `
          <div class="detail-grid">
            ${detailItem("วันที่ประกาศ", formatDate(job.published))}
            ${detailItem("วันที่เปิดรับสมัคร", formatDate(job.startDate))}
            ${detailItem("วันที่สิ้นสุดรับสมัคร", formatDate(job.endDate))}
          </div>
        `)}

        ${detailSection("รายละเอียดงาน", `
          <p>${escapeHTML(job.description)}</p>
        `)}

        ${detailSection("หน้าที่ความรับผิดชอบ", listHTML(job.duties))}

        ${detailSection("คุณสมบัติผู้สมัคร", listHTML(job.qualifications))}

        ${detailSection("คณะที่บริษัทต้องการ", listHTML(job.faculty))}

        ${detailSection("วันและเวลาทำงาน", `
          <div class="detail-grid">
            ${detailItem("วันทำงาน", job.workDays)}
            ${detailItem("เวลาทำงาน", job.workTime)}
          </div>
        `)}

        ${detailSection("สวัสดิการ", `
          <p>${escapeHTML(job.benefits)}</p>
        `)}

        <div class="demo-note">
          ข้อมูลทั้งหมดเป็นข้อมูลสมมติสำหรับทดสอบเว็บไซต์เท่านั้น
          ลิงก์สมัครงานยังไม่ส่งใบสมัครจริง
        </div>
      `;

      modal.hidden = false;
      document.body.classList.add("modal-open");
      closeModalButton.focus();
    }

    function closeJobModal() {
      if (modal.hidden) return;

      modal.hidden = true;
      document.body.classList.remove("modal-open");
      activeJob = null;

      if (lastFocusedElement && document.contains(lastFocusedElement)) {
        lastFocusedElement.focus();
      }
    }

    function demoApply(job) {
      alert(
        "นี่คือปุ่มสมัครงานตัวอย่าง\n\n" +
        "ตำแหน่ง: " + job.title + "\n" +
        "บริษัท: " + job.company + "\n\n" +
        "ระบบยังไม่ส่งใบสมัครจริง"
      );
    }

    function clearFilters() {
      keywordInput.value = "";
      familySelect.value = "";
      locationSelect.value = "";
      facultySelect.value = "";
      selectedMonths = null;

      quickButtons.forEach(button => button.classList.remove("active"));
      renderJobs();
    }

    keywordInput.addEventListener("input", renderJobs);
    familySelect.addEventListener("change", renderJobs);
    locationSelect.addEventListener("change", renderJobs);
    facultySelect.addEventListener("change", renderJobs);

    quickButtons.forEach(button => {
      button.addEventListener("click", () => {
        const months = Number(button.dataset.months);
        selectedMonths = selectedMonths === months ? null : months;

        quickButtons.forEach(item => {
          item.classList.toggle(
            "active",
            Number(item.dataset.months) === selectedMonths
          );
        });

        renderJobs();
      });
    });

    clearFiltersButton.addEventListener("click", clearFilters);
    closeModalButton.addEventListener("click", closeJobModal);
    closeModalBottom.addEventListener("click", closeJobModal);

    /* คลิกพื้นหลังนอกกล่องเพื่อปิด Popup */
    modal.addEventListener("click", event => {
      if (event.target === modal) {
        closeJobModal();
      }
    });

    /* กด Escape เพื่อปิด Popup */
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && !modal.hidden) {
        closeJobModal();
      }
    });

    /* ปุ่มทำงานบนการ์ด */
    jobsList.addEventListener("click", event => {
      const detailButton = event.target.closest("[data-detail]");
      const applyButton = event.target.closest("[data-apply]");

      if (detailButton) {
        const job = jobs.find(item => item.id === detailButton.dataset.detail);
        if (job) openJobModal(job);
      }

      if (applyButton) {
        const job = jobs.find(item => item.id === applyButton.dataset.apply);
        if (job) demoApply(job);
      }
    });

    /* ปุ่มสมัครงานภายใน Popup เป็นปุ่มตัวอย่างเช่นกัน */
    modalApply.addEventListener("click", () => {
      if (activeJob) demoApply(activeJob);
    });

    setupFilters();
    renderJobs();
  </script>
</body>
</html>
