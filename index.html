<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobboard | งานประจำ</title>
<style>
:root {
  --navy: #17365d;
  --blue: #2864b4;
  --light: #f4f7fb;
  --border: #e1e7ef;
  --muted: #65738a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, Tahoma, sans-serif;
  color: #263449;
  background: var(--light);
}
header {
  background: var(--navy);
  color: white;
  padding: 26px 6%;
}
.brand { font-size: 27px; font-weight: 800; }
header p { color: #dbeafe; margin-bottom: 0; }
main { max-width: 1180px; margin: auto; padding: 26px 18px 50px; }
h2 { margin-top: 0; }
.panel, .job-card, .detail {
  background: white;
  border: 1px solid var(--border);
  border-radius: 13px;
}
.panel { padding: 18px; margin-bottom: 22px; }
.search-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap: 12px;
}
.date-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 14px;
}
label {
  display: block;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 6px;
}
input, select {
  width: 100%;
  min-width: 0;
  padding: 11px;
  border: 1px solid #ccd5e2;
  border-radius: 8px;
  background: white;
  font: inherit;
  color: inherit;
}
.quick-search {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
  align-items: center;
}
button, .apply {
  display: inline-block;
  border: 0;
  border-radius: 8px;
  padding: 11px 15px;
  background: var(--blue);
  color: white;
  font: inherit;
  font-size: 14px;
  cursor: pointer;
  text-decoration: none;
}
button:hover, .apply:hover { opacity: .88; }
button.secondary { background: #e9eef6; color: #263449; }
button.active { background: var(--navy); }
.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin: 22px 0 14px;
}
.section-heading h2 { margin: 0; font-size: 21px; }
.job-list {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 15px;
}
.job-card { padding: 17px; min-width: 0; }
.company-head {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-bottom: 14px;
}
.logo {
  width: 52px;
  height: 52px;
  flex-shrink: 0;
  border-radius: 12px;
  display: grid;
  place-items: center;
  color: white;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: .5px;
}
.company-name { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.job-card h3 { color: var(--navy); margin: 0 0 12px; font-size: 18px; }
.tag {
  display: inline-block;
  background: #edf3fc;
  color: #214d82;
  border-radius: 20px;
  padding: 5px 9px;
  font-size: 12px;
  margin: 0 5px 7px 0;
}
.salary { font-weight: bold; margin: 7px 0 12px; }
.meta { color: var(--muted); font-size: 13px; line-height: 1.8; }
.job-card button { margin-top: 13px; width: 100%; }
.detail { padding: 22px; margin-top: 22px; scroll-margin-top: 15px; }
.detail h2 { color: var(--navy); }
.detail h3 { margin-bottom: 8px; }
.detail p, .detail li { line-height: 1.75; }
.detail .company-head { margin-bottom: 18px; }
.detail-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 18px; }
.hidden { display: none; }
.empty {
  background: white; border: 1px dashed #cbd5e1;
  border-radius: 12px; padding: 28px; text-align: center;
  color: var(--muted); grid-column: 1 / -1;
}
.notice { margin-top: 25px; font-size: 12px; color: var(--muted); line-height: 1.7; }
@media (max-width: 850px) {
  .job-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .search-grid { grid-template-columns: 1fr 1fr; }
  .search-grid > :first-child { grid-column: 1 / -1; }
}
@media (max-width: 560px) {
  .job-list, .search-grid, .date-grid { grid-template-columns: 1fr; }
  .search-grid > :first-child { grid-column: auto; }
  header { padding: 22px 18px; }
}
</style>
</head>
<body>
<header>
  <div class="brand">Jobboard</div>
  <p>ค้นหาโอกาสงานประจำที่เหมาะกับคุณ</p>
</header>

<main>
  <section class="panel">
    <h2>ค้นหางานประจำ</h2>
    <div class="search-grid">
      <div>
        <label for="keyword">ชื่อตำแหน่งหรือบริษัท</label>
        <input id="keyword" placeholder="เช่น เจ้าหน้าที่การตลาด">
      </div>
      <div>
        <label for="career">สายงาน</label>
        <select id="career"><option value="">ทุกสายงาน</option></select>
      </div>
      <div>
        <label for="location">พื้นที่ทำงาน</label>
        <select id="location">
          <option value="">ทุกพื้นที่</option>
          <option>กรุงเทพมหานคร</option>
          <option>นนทบุรี</option>
          <option>ปทุมธานี</option>
          <option>สมุทรปราการ</option>
        </select>
      </div>
    </div>

    <div style="margin-top:14px">
      <label for="faculty">คณะวิชาที่บริษัทต้องการ</label>
      <select id="faculty">
        <option value="">ทุกคณะวิชา</option>
      </select>
    </div>

    <div class="date-grid">
      <div>
        <label for="dateFrom">วันที่ประกาศงาน — ตั้งแต่</label>
        <input type="date" id="dateFrom">
      </div>
      <div>
        <label for="dateTo">วันที่ประกาศงาน — ถึง</label>
        <input type="date" id="dateTo">
      </div>
    </div>

    <div class="quick-search">
      <span style="font-size:13px;color:var(--muted)">ค้นหาย้อนหลัง:</span>
      <button class="secondary" data-months="1">1 เดือน</button>
      <button class="secondary" data-months="2">2 เดือน</button>
      <button class="secondary" data-months="3">3 เดือน</button>
      <button id="clearDates" class="secondary">ทุกช่วงวันที่</button>
    </div>
  </section>

  <div class="section-heading">
    <h2>ตำแหน่งงานที่เปิดรับ</h2>
    <span id="resultCount" class="meta"></span>
  </div>

  <div id="jobs" class="job-list"></div>
  <section id="detail" class="detail hidden"></section>

  <p class="notice">
    เว็บไซต์ต้นแบบเพื่อทดสอบระบบ ข้อมูลบริษัท ตำแหน่งงาน และค่าตอบแทนทั้งหมดเป็นข้อมูลสมมติ
    โลโก้เป็นอักษรย่อจำลอง ลิงก์สมัครเป็นลิงก์ตัวอย่าง ไม่ใช่การสมัครงานจริง
  </p>
</main>

<script>
// ข้อมูลสมมติเท่านั้น: แก้ไขข้อมูลแต่ละตำแหน่งได้ในรายการนี้
// วันที่ใช้รูปแบบ YYYY-MM-DD
const jobs = [
  {
    id: 1, logo: "EX", logoColor: "#2864b4",
    company: "บริษัท ตัวอย่าง เอ จำกัด",
    title: "เจ้าหน้าที่ประสานงาน",
    career: "ธุรการและประสานงาน",
    location: "กรุงเทพมหานคร",
    salary: "15,000–18,000 บาท/เดือน",
    published: "2026-10-05",
    start: "2026-10-05",
    end: "2026-11-05",
    faculties: ["บริหารธุรกิจ", "ศิลปศาสตร์", "มนุษยศาสตร์"],
    description: "ประสานงานภายในองค์กร จัดเตรียมเอกสาร และติดต่อหน่วยงานที่เกี่ยวข้อง",
    qualifications: ["ใช้โปรแกรมสำนักงานพื้นฐานได้", "สื่อสารและประสานงานได้ดี"],
    applyUrl: "https://example.com/"
  },
  {
    id: 2, logo: "ST", logoColor: "#7c4dba",
    company: "สตูดิโอ ตัวอย่าง บี จำกัด",
    title: "นักวาดภาพประกอบ",
    career: "ศิลปะและออกแบบ",
    location: "นนทบุรี",
    salary: "18,000–22,000 บาท/เดือน",
    published: "2026-09-25",
    start: "2026-09-25",
    end: "2026-10-25",
    faculties: ["ศิลปกรรมศาสตร์", "นิเทศศาสตร์", "เทคโนโลยีสารสนเทศ"],
    description: "จัดทำภาพประกอบและพัฒนาผลงานร่วมกับทีมสร้างสรรค์",
    qualifications: ["มีผลงานวาดภาพ", "ใช้โปรแกรมวาดภาพดิจิทัลได้"],
    applyUrl: "https://example.com/"
  },
  {
    id: 3, logo: "MK", logoColor: "#008577",
    company: "บริษัท ตัวอย่าง ซี จำกัด",
    title: "เจ้าหน้าที่การตลาด",
    career: "การตลาดและประชาสัมพันธ์",
    location: "ปทุมธานี",
    salary: "18,000–22,000 บาท/เดือน",
    published: "2026-09-10",
    start: "2026-09-10",
    end: "2026-10-31",
    faculties: ["บริหารธุรกิจ", "นิเทศศาสตร์", "ศิลปศาสตร์"],
    description: "ช่วยวางแผนกิจกรรมการตลาดและจัดทำเนื้อหาประชาสัมพันธ์",
    qualifications: ["มีทักษะการสื่อสาร", "ทำงานเป็นทีมได้"],
    applyUrl: "https://example.com/"
  },
  {
    id: 4, logo: "HR", logoColor: "#c05a35",
    company: "บริษัท ตัวอย่าง ดี จำกัด",
    title: "เจ้าหน้าที่ทรัพยากรบุคคล",
    career: "ทรัพยากรบุคคล",
    location: "กรุงเทพมหานคร",
    salary: "17,000–20,000 บาท/เดือน",
    published: "2026-08-20",
    start: "2026-08-20",
    end: "2026-10-20",
    faculties: ["บริหารธุรกิจ", "ศิลปศาสตร์", "มนุษยศาสตร์"],
    description: "ประสานงานการรับสมัคร ดูแลเอกสาร และสนับสนุนงานบุคคล",
    qualifications: ["ละเอียดรอบคอบ", "ใช้โปรแกรมสำนักงานได้"],
    applyUrl: "https://example.com/"
  },
  {
    id: 5, logo: "IT", logoColor: "#3d6590",
    company: "บริษัท ตัวอย่าง อี จำกัด",
    title: "เจ้าหน้าที่ IT Support",
    career: "เทคโนโลยีสารสนเทศ",
    location: "นนทบุรี",
    salary: "18,000–25,000 บาท/เดือน",
    published: "2026-07-15",
    start: "2026-07-15",
    end: "2026-10-15",
    faculties: ["เทคโนโลยีสารสนเทศ", "วิศวกรรมศาสตร์", "วิทยาศาสตร์"],
    description: "ช่วยแก้ไขปัญหาคอมพิวเตอร์ โปรแกรม และอุปกรณ์สำนักงาน",
    qualifications: ["มีความรู้ IT เบื้องต้น", "รักการเรียนรู้และการแก้ปัญหา"],
    applyUrl: "https://example.com/"
  },
  {
    id: 6, logo: "FN", logoColor: "#a26b12",
    company: "บริษัท ตัวอย่าง เอฟ จำกัด",
    title: "เจ้าหน้าที่บัญชี",
    career: "บัญชีและการเงิน",
    location: "สมุทรปราการ",
    salary: "17,000–21,000 บาท/เดือน",
    published: "2026-06-12",
    start: "2026-06-12",
    end: "2026-10-12",
    faculties: ["บัญชี", "บริหารธุรกิจ"],
    description: "สนับสนุนงานเอกสารบัญชีและประสานงานภายในฝ่าย",
    qualifications: ["จบสาขาบัญชีหรือสาขาที่เกี่ยวข้อง", "ละเอียดรอบคอบ"],
    applyUrl: "https://example.com/"
  }
];

const $ = id => document.getElementById(id);
const keyword = $("keyword");
const career = $("career");
const locationFilter = $("location");
const faculty = $("faculty");
const dateFrom = $("dateFrom");
const dateTo = $("dateTo");
const jobsBox = $("jobs");
const detail = $("detail");
let activeMonths = 0;

function formatDate(value) {
  if (!value) return "ไม่ระบุ";
  const [y, m, d] = value.split("-").map(Number);
  return `${String(d).padStart(2,"0")}/${String(m).padStart(2,"0")}/${y}`;
}

function uniqueSorted(values) {
  return [...new Set(values)].sort((a,b) => a.localeCompare(b, "th"));
}

uniqueSorted(jobs.map(j => j.career)).forEach(value => {
  const option = document.createElement("option");
  option.value = value;
  option.textContent = value;
  career.appendChild(option);
});

uniqueSorted(jobs.flatMap(j => j.faculties)).forEach(value => {
  const option = document.createElement("option");
  option.value = value;
  option.textContent = value;
  faculty.appendChild(option);
});

function applyQuickRange(months) {
  activeMonths = months;
  const end = new Date();
  const start = new Date();
  start.setMonth(start.getMonth() - months);

  dateFrom.value = [
    start.getFullYear(),
    String(start.getMonth() + 1).padStart(2,"0"),
    String(start.getDate()).padStart(2,"0")
  ].join("-");
  dateTo.value = [
    end.getFullYear(),
    String(end.getMonth() + 1).padStart(2,"0"),
    String(end.getDate()).padStart(2,"0")
  ].join("-");

  document.querySelectorAll("[data-months]").forEach(button => {
    button.classList.toggle("active", Number(button.dataset.months) === months);
    button.classList.toggle("secondary", Number(button.dataset.months) !== months);
  });
  $("clearDates").classList.remove("active");
  renderJobs();
}

function clearDateRange() {
  activeMonths = 0;
  dateFrom.value = "";
  dateTo.value = "";
  document.querySelectorAll("[data-months]").forEach(button => {
    button.classList.remove("active");
    button.classList.add("secondary");
  });
  $("clearDates").classList.add("active");
  renderJobs();
}

function getFilteredJobs() {
  const q = keyword.value.trim().toLocaleLowerCase("th");
  return jobs.filter(job => {
    const text = `${job.title} ${job.company}`.toLocaleLowerCase("th");
    return (
      text.includes(q) &&
      (!career.value || job.career === career.value) &&
      (!locationFilter.value || job.location === locationFilter.value) &&
      (!faculty.value || job.faculties.includes(faculty.value)) &&
      (!dateFrom.value || job.published >= dateFrom.value) &&
      (!dateTo.value || job.published <= dateTo.value)
    );
  }).sort((a,b) => b.published.localeCompare(a.published));
}

function renderJobs() {
  const filtered = getFilteredJobs();
  $("resultCount").textContent = `พบ ${filtered.length} ตำแหน่ง`;
  jobsBox.replaceChildren();

  if (!filtered.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "ไม่พบงานประจำที่ตรงกับเงื่อนไข ลองปรับคำค้นหาหรือช่วงวันที่";
    jobsBox.appendChild(empty);
    return;
  }

  filtered.forEach(job => {
    const card = document.createElement("article");
    card.className = "job-card";

    const head = document.createElement("div");
    head.className = "company-head";

    const logo = document.createElement("div");
    logo.className = "logo";
    logo.style.background = job.logoColor;
    logo.textContent = job.logo;
    logo.setAttribute("aria-label", "โลโก้จำลอง " + job.company);

    const company = document.createElement("div");
    company.className = "company-name";
    company.textContent = job.company;
    head.append(logo, company);

    const title = document.createElement("h3");
    title.textContent = job.title;

    const tag1 = document.createElement("span");
    tag1.className = "tag";
    tag1.textContent = "งานประจำ";

    const tag2 = document.createElement("span");
    tag2.className = "tag";
    tag2.textContent = job.career;

    const salary = document.createElement("p");
    salary.className = "salary";
    salary.textContent = job.salary;

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `พื้นที่: ${job.location} · ประกาศ: ${formatDate(job.published)}`;

    const button = document.createElement("button");
    button.textContent = "ดูรายละเอียดงาน";
    button.addEventListener("click", () => showDetail(job.id));

    card.append(head, title, tag1, tag2, salary, meta, button);
    jobsBox.appendChild(card);
  });
}

function addText(parent, tagName, text) {
  const element = document.createElement(tagName);
  element.textContent = text;
  parent.appendChild(element);
  return element;
}

function showDetail(id) {
  const job = jobs.find(item => item.id === id);
  if (!job) return;

  detail.replaceChildren();
  detail.classList.remove("hidden");

  const head = document.createElement("div");
  head.className = "company-head";
  const logo = document.createElement("div");
  logo.className = "logo";
  logo.style.background = job.logoColor;
  logo.textContent = job.logo;
  const company = document.createElement("div");
  company.className = "company-name";
  company.textContent = job.company;
  head.append(logo, company);
  detail.appendChild(head);

  addText(detail, "h2", job.title);
  addText(detail, "p", "ประเภทการจ้าง: งานประจำ (Full-time)");
  addText(detail, "p", "สายงาน: " + job.career);
  addText(detail, "p", "พื้นที่ทำงาน: " + job.location);
  addText(detail, "p", "เงินเดือน: " + job.salary);
  addText(detail, "p", "วันที่ประกาศ: " + formatDate(job.published));
  addText(detail, "p", "วันเริ่มต้นรับสมัคร: " + formatDate(job.start));
  addText(detail, "p", "วันสิ้นสุดรับสมัคร: " + formatDate(job.end));

  addText(detail, "h3", "คณะวิชาที่บริษัทต้องการ");
  addText(detail, "p", job.faculties.join("、"));

  addText(detail, "h3", "รายละเอียดงาน");
  addText(detail, "p", job.description);

  addText(detail, "h3", "คุณสมบัติ");
  const list = document.createElement("ul");
  job.qualifications.forEach(item => addText(list, "li", item));
  detail.appendChild(list);

  const note = document.createElement("p");
  note.className = "notice";
  note.textContent = "ข้อมูลนี้เป็นข้อมูลสมมติสำหรับทดสอบ ลิงก์สมัครด้านล่างไม่ใช่ระบบสมัครงานจริง";
  detail.appendChild(note);

  const actions = document.createElement("div");
  actions.className = "detail-actions";

  const apply = document.createElement("a");
  apply.className = "apply";
  apply.href = job.applyUrl;
  apply.target = "_blank";
  apply.rel = "noopener noreferrer";
  apply.textContent = "ทดลองเปิดลิงก์สมัคร";
  actions.appendChild(apply);

  const close = document.createElement("button");
  close.className = "secondary";
  close.textContent = "ปิดรายละเอียด";
  close.addEventListener("click", () => detail.classList.add("hidden"));
  actions.appendChild(close);

  detail.appendChild(actions);
  detail.scrollIntoView({ behavior: "smooth", block: "start" });
}

[keyword, career, locationFilter, faculty].forEach(element => {
  element.addEventListener("input", renderJobs);
  element.addEventListener("change", renderJobs);
});

dateFrom.addEventListener("change", () => {
  activeMonths = 0;
  renderJobs();
});
dateTo.addEventListener("change", () => {
  activeMonths = 0;
  renderJobs();
});

document.querySelectorAll("[data-months]").forEach(button => {
  button.addEventListener("click", () => applyQuickRange(Number(button.dataset.months)));
});
$("clearDates").addEventListener("click", clearDateRange);

renderJobs();
</script>
</body>
</html>
