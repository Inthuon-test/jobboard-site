<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerSpace | ค้นหางานประจำ</title>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --background: #f6f7fb;
      --surface: #ffffff;
      --text: #20243a;
      --muted: #737991;
      --border: #e8eaf2;
      --green: #15966a;
      --shadow: 0 5px 24px rgba(31, 41, 75, 0.05);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: var(--background);
      color: var(--text);
      font-size: 14px;
    }

    button, input, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
    }

    .topbar {
      height: 72px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      color: white;
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #6366f1, #4338ca);
    }

    .brand-name {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .topbar-right {
      color: var(--muted);
      font-size: 13px;
    }

    .topbar { gap: 18px; }
    .topnav { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .topnav a { color: var(--muted); text-decoration: none; padding: 9px 11px; border-radius: 8px; font-weight: 700; font-size: 12px; }
    .topnav a:hover, .topnav a.active { background: var(--primary-light); color: var(--primary); }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 17px; }
    .hero-link { display: inline-flex; align-items: center; justify-content: center; padding: 10px 14px; border-radius: 9px; text-decoration: none; font-weight: 800; font-size: 12px; border: 1px solid var(--border); color: var(--text); background: white; }
    .hero-link.primary { background: var(--primary); border-color: var(--primary); color: white; }
    .status-summary { display: flex; flex-wrap: wrap; gap: 8px; margin: -8px 0 22px; }
    .status-pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 7px 10px; font-size: 11px; font-weight: 800; background: #f3f4f6; color: #555b72; }
    .status-pill.open { background: #dcfce7; color: #166534; }
    .status-pill.closed { background: #fee2e2; color: #991b1b; }
    .status-pill.unknown { background: #fef3c7; color: #92400e; }
    .status-tag { display: inline-flex; border-radius: 6px; padding: 4px 7px; font-size: 10px; font-weight: 800; line-height: 1.5; }
    .status-tag.open { background: #dcfce7; color: #166534; }
    .status-tag.closing { background: #fef3c7; color: #92400e; }
    .status-tag.unknown { background: #fef3c7; color: #92400e; }
    .status-tag.closed { background: #fee2e2; color: #991b1b; }
    .subsection-label { grid-column: 1 / -1; margin: 5px 0 -4px; padding: 11px 13px; border-radius: 10px; background: #f8f9fc; border: 1px solid var(--border); color: var(--muted); font-size: 12px; line-height: 1.6; }
    .subsection-label strong { color: var(--text); }
    .view-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
    .view-tab { padding: 9px 13px; border: 1px solid var(--border); border-radius: 9px; background: white; color: var(--muted); font-weight: 800; }
    .view-tab.active { background: var(--primary-light); border-color: #c7d2fe; color: var(--primary); }
    .history-note { color: var(--muted); font-size: 12px; margin: 0 0 14px; line-height: 1.6; }

    .layout {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      min-height: calc(100vh - 72px);
    }

    .sidebar {
      padding: 25px 20px;
      background: var(--surface);
      border-right: 1px solid var(--border);
    }

    .sidebar-heading {
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: 0.7px;
      margin: 0 0 18px;
    }

    .filter-group {
      margin-bottom: 22px;
    }

    .filter-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .filter-group input,
    .filter-group select {
      width: 100%;
      min-width: 0;
      padding: 11px 12px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 9px;
      outline: none;
      color: var(--text);
    }

    .filter-group input:focus,
    .filter-group select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.08);
    }

    .clear-button {
      width: 100%;
      padding: 11px;
      border: 1px solid #d9dcf5;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 9px;
      font-weight: 700;
    }

    .clear-button:hover {
      background: #e0e7ff;
    }

    .sidebar-note {
      margin-top: 28px;
      padding: 14px;
      border-radius: 12px;
      background: #f8f9ff;
      color: var(--muted);
      line-height: 1.7;
      font-size: 12px;
    }

    main {
      padding: 28px;
      min-width: 0;
    }

    .welcome {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .welcome h1 {
      margin: 0 0 7px;
      font-size: 26px;
      letter-spacing: -0.6px;
    }

    .welcome p {
      color: var(--muted);
      margin: 0;
      line-height: 1.6;
    }

    .date-chip {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      white-space: nowrap;
      color: var(--muted);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 20px;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .stat-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .stat-icon {
      width: 39px;
      height: 39px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 12px;
      font-size: 19px;
      background: var(--primary-light);
    }

    .stat-number {
      font-size: 29px;
      font-weight: 800;
      margin-top: 15px;
      letter-spacing: -0.6px;
    }

    .stat-foot {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
    }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 28px;
    }

    .chart-card {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 21px;
      box-shadow: var(--shadow);
    }

    .chart-card h2 {
      font-size: 15px;
      margin: 0 0 6px;
    }

    .chart-description {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .pie-layout {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 24px;
      min-height: 205px;
    }

      height: 175px;
